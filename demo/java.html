<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p-react · Java 视角</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <style>
    :root {
      --sidebar-w: 260px;
      --bg-base: #0d1117;
      --bg-elevated: #161b22;
      --bg-overlay: #1c2128;
      --border: #21262d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #484f58;
      --accent: #e8590c;
      --accent-light: #f59e42;
      --accent-glow: rgba(232, 89, 12, 0.15);
      --red: #f85149;
      --red-glow: rgba(248, 81, 73, 0.12);
      --yellow: #d29922;
      --yellow-glow: rgba(210, 153, 34, 0.12);
      --green: #3fb950;
      --green-glow: rgba(63, 185, 80, 0.12);
      --blue: #58a6ff;
      --blue-glow: rgba(88, 166, 255, 0.12);
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-code: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-ui);
      background: var(--bg-base);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    .app { display: flex; height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--bg-base);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 18px 16px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo-hexagon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), #f59e42);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .logo-text { font-size: 15px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.3px; }

    .logo-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--accent-light);
      background: var(--accent-glow);
      border: 1px solid rgba(232, 89, 12, 0.3);
      border-radius: 4px;
      padding: 1px 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 2px; }

    .nav-group { margin-bottom: 4px; }

    .nav-group-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 12px 16px 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 16px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      position: relative;
      color: var(--text-secondary);
      font-size: 13.5px;
    }

    .nav-item:hover { background: var(--bg-overlay); color: var(--text-primary); }

    .nav-item.active {
      background: var(--accent-glow);
      color: var(--accent-light);
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 3px; bottom: 3px;
      width: 3px;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }

    .nav-item-icon { font-size: 14px; flex-shrink: 0; width: 18px; text-align: center; }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .back-link:hover { color: var(--text-secondary); border-color: var(--text-secondary); background: var(--bg-overlay); }

    /* ── Content ── */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-elevated);
    }

    .content-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 20px;
      height: 40px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .content-header-icon { font-size: 12px; color: var(--text-muted); font-family: var(--font-code); }
    .content-header-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
    .content-header-dot { color: var(--text-muted); font-size: 11px; }
    .content-header-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .content-header-spacer { flex: 1; }

    .content-header-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 7px;
    }

    /* ── Article ── */
    .article-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 32px 36px 48px;
    }

    .article-wrapper::-webkit-scrollbar { width: 8px; }
    .article-wrapper::-webkit-scrollbar-track { background: transparent; }
    .article-wrapper::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }
    .article-wrapper::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

    .article { display: none; }
    .article.active { display: block; }

    /* ── Article header ── */
    .article-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 20px;
    }

    .article-icon {
      font-size: 28px;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .article-meta { flex: 1; }

    .article-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .article-tags { display: flex; gap: 6px; flex-wrap: wrap; }

    .tag {
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      padding: 2px 8px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .tag-danger  { color: var(--red);         background: var(--red-glow);    border: 1px solid rgba(248,81,73,0.25); }
    .tag-warning { color: var(--yellow);       background: var(--yellow-glow); border: 1px solid rgba(210,153,34,0.25); }
    .tag-info    { color: var(--blue);         background: var(--blue-glow);   border: 1px solid rgba(88,166,255,0.25); }
    .tag-success { color: var(--green);        background: var(--green-glow);  border: 1px solid rgba(63,185,80,0.25); }
    .tag-accent  { color: var(--accent-light); background: var(--accent-glow); border: 1px solid rgba(232,89,12,0.3); }

    .article-divider { height: 1px; background: var(--border); margin-bottom: 24px; }

    /* ── Section blocks ── */
    .section { margin-bottom: 28px; }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .section-body {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.8;
    }

    .section-body p { margin-bottom: 10px; }
    .section-body p:last-child { margin-bottom: 0; }
    .section-body strong { color: var(--text-primary); font-weight: 600; }
    .section-body ul { padding-left: 20px; margin-bottom: 10px; }
    .section-body li { margin-bottom: 4px; }

    .section-body code {
      font-family: var(--font-code);
      font-size: 12px;
      background: var(--bg-overlay);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      color: var(--accent-light);
    }

    /* ── Code blocks ── */
    .code-block-wrap {
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .code-block-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: var(--bg-overlay);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-family: var(--font-code);
    }

    .code-block-label-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-red    { background: var(--red); }
    .dot-green  { background: var(--green); }
    .dot-yellow { background: var(--yellow); }
    .dot-blue   { background: var(--blue); }
    .dot-orange { background: var(--accent); }

    .code-block-label-text { color: var(--text-secondary); }

    .code-block-wrap pre { margin: 0; padding: 16px 18px; background: var(--bg-base) !important; }
    .code-block-wrap code {
      font-family: var(--font-code) !important;
      font-size: 12px !important;
      line-height: 1.7 !important;
    }
    .code-block-wrap .hljs { background: var(--bg-base) !important; }

    /* ── Code blocks row (side-by-side) ── */
    .code-blocks-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    .code-blocks-row .code-block-wrap { margin-bottom: 0; }

    @media (max-width: 900px) {
      .code-blocks-row { grid-template-columns: 1fr; }
    }

    /* ── Rule box ── */
    .rule-box {
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 14px;
      border-left: 3px solid;
      font-size: 13.5px;
      line-height: 1.7;
    }

    .rule-box-danger  { background: var(--red-glow);    border-color: var(--red);    color: #ffa8a8; }
    .rule-box-warning { background: var(--yellow-glow); border-color: var(--yellow); color: #f0c070; }
    .rule-box-info    { background: var(--blue-glow);   border-color: var(--blue);   color: #a0c8ff; }
    .rule-box-success { background: var(--green-glow);  border-color: var(--green);  color: #90dca0; }
    .rule-box-accent  { background: var(--accent-glow); border-color: var(--accent); color: #f8c09a; }

    .rule-box strong { color: inherit; font-weight: 700; }
    .rule-box code {
      font-family: var(--font-code);
      font-size: 11.5px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      padding: 1px 5px;
    }

    /* ── Compare card ── */
    .compare-card {
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 14px;
      font-size: 13px;
    }

    .compare-card-header {
      display: grid;
      grid-template-columns: 1fr 1fr 1.4fr;
      gap: 0;
      background: var(--bg-overlay);
      border-bottom: 1px solid var(--border);
    }

    .compare-card-header-cell {
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .compare-card-header-cell.frontend { color: var(--blue); }
    .compare-card-header-cell.java     { color: var(--accent-light); }
    .compare-card-header-cell.desc     { color: var(--text-muted); }

    .compare-card-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1.4fr;
      gap: 0;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }
    .compare-card-row:last-child { border-bottom: none; }
    .compare-card-row:hover { background: var(--bg-overlay); }

    .compare-card-cell {
      padding: 10px 14px;
      line-height: 1.5;
      vertical-align: middle;
      font-family: var(--font-code);
      font-size: 12px;
    }

    .compare-card-cell.frontend { color: var(--blue); }
    .compare-card-cell.java     { color: var(--accent-light); }
    .compare-card-cell.desc     {
      font-family: var(--font-ui);
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    /* ── Mobile ── */
    .menu-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .menu-toggle:hover { background: var(--bg-overlay); color: var(--text-primary); }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 99;
    }
    .sidebar-overlay.visible { display: block; }

    @media (max-width: 700px) {
      body { overflow: hidden; }
      .menu-toggle { display: flex; }
      .app { flex-direction: column; }

      .sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: 260px;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }
      .sidebar.open { transform: translateX(0); }

      .mobile-topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        height: 48px;
        background: var(--bg-base);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .mobile-topbar-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .content { height: calc(100vh - 48px); }
      .article-wrapper { padding: 20px 16px 40px; }
      .nav-item { padding: 11px 16px; font-size: 14px; }
      .compare-card-header,
      .compare-card-row { grid-template-columns: 1fr 1fr; }
      .compare-card-header-cell.desc,
      .compare-card-cell.desc { display: none; }
    }
  </style>
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="app">
  <!-- Mobile Topbar -->
  <div class="mobile-topbar" id="mobile-topbar" style="display:none">
    <button class="menu-toggle" id="menu-toggle-top" aria-label="打开菜单">☰</button>
    <span class="mobile-topbar-title" id="mobile-topbar-title">Java 视角</span>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar-el">
    <div class="sidebar-logo">
      <div class="logo-hexagon">☕</div>
      <span class="logo-text">Java 视角</span>
      <span class="logo-badge">Java</span>
      <div style="flex:1"></div>
      <button class="menu-toggle" id="sidebar-close" aria-label="关闭菜单" style="display:none">✕</button>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <a class="back-link" href="hub.html">← 返回首页</a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="content">
    <div class="content-header">
      <span class="content-header-icon">☕</span>
      <span class="content-header-label">Java 视角</span>
      <span class="content-header-dot">·</span>
      <span class="content-header-name" id="content-header-name">选择左侧条目</span>
      <div class="content-header-spacer"></div>
      <span class="content-header-badge" id="content-header-badge">工具链</span>
    </div>
    <div class="article-wrapper" id="article-wrapper"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const topics = [
  {
    id: 'maven-vs-npm',
    name: 'Maven vs npm',
    group: '📦 工具链',
    type: 'accent',
    icon: '📦',
    tags: [
      { label: 'Maven', type: 'accent' },
      { label: 'npm', type: 'info' },
      { label: '依赖管理', type: 'warning' },
      { label: '工具链', type: 'success' },
    ],
  },
];

// ── Helpers ──────────────────────────────────────────────────────────────────

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function tagsHtml(tags) {
  return tags.map(t => `<span class="tag tag-${escHtml(t.type)}">${escHtml(t.label)}</span>`).join('');
}

function codeBlock(label, dotClass, lang, code) {
  return `
    <div class="code-block-wrap">
      <div class="code-block-label">
        <span class="code-block-label-dot ${escHtml(dotClass)}"></span>
        <span class="code-block-label-text">${escHtml(label)}</span>
      </div>
      <pre><code class="language-${lang}">${escHtml(code)}</code></pre>
    </div>`;
}

function codeBlocksRow(blocks) {
  return `<div class="code-blocks-row">${blocks.join('')}</div>`;
}

function ruleBox(type, html) {
  return `<div class="rule-box rule-box-${type}">${html}</div>`;
}

function section(title, bodyHtml) {
  return `
    <div class="section">
      <div class="section-title">${title}</div>
      <div class="section-body">${bodyHtml}</div>
    </div>`;
}

function articleShell(t, innerHtml) {
  return `
    <div class="article-header">
      <div class="article-icon">${t.icon}</div>
      <div class="article-meta">
        <div class="article-title">${t.name}</div>
        <div class="article-tags">${tagsHtml(t.tags)}</div>
      </div>
    </div>
    <div class="article-divider"></div>
    ${innerHtml}`;
}

function compareCard(rows) {
  const headerHtml = `
    <div class="compare-card-header">
      <div class="compare-card-header-cell frontend">前端（npm）</div>
      <div class="compare-card-header-cell java">Java（Maven）</div>
      <div class="compare-card-header-cell desc">说明</div>
    </div>`;

  const rowsHtml = rows.map(([fe, java, desc]) => `
    <div class="compare-card-row">
      <div class="compare-card-cell frontend">${escHtml(fe)}</div>
      <div class="compare-card-cell java">${escHtml(java)}</div>
      <div class="compare-card-cell desc">${escHtml(desc)}</div>
    </div>`).join('');

  return `<div class="compare-card">${headerHtml}${rowsHtml}</div>`;
}

// ── Renderers ─────────────────────────────────────────────────────────────────

function renderMavenVsNpm(t) {
  const conclusion = ruleBox('accent',
    `Maven 之于 Java，等同于 npm 之于 Node.js。核心差异：依赖配置是声明式 XML（<code>pom.xml</code>），项目目录里<strong>没有</strong> <code>node_modules</code>，所有依赖统一缓存在 <code>~/.m2/repository/</code>，多个项目共享同一份缓存。`);

  const rows = [
    ['package.json',       'pom.xml',                   '项目元信息 + 依赖声明'],
    ['npm install',        'mvn dependency:resolve',    '下载所有依赖到本地缓存'],
    ['node_modules/',      '~/.m2/repository/',         '全局缓存，不在项目目录内'],
    ['npm run build',      'mvn package',               '编译 → 测试 → 打包为 .jar'],
    ['npm run dev',        'mvn spring-boot:run',       '启动本地开发服务器'],
    ['devDependencies',    '<scope>test</scope>',        '仅测试阶段可用'],
    ['peerDependencies',   '<scope>provided</scope>',   '运行时由容器提供（如 Servlet API）'],
    ['package-lock.json',  '<dependencyManagement>',    '在父 pom 中统一锁定版本'],
    ['^1.2.3（浮动版本）', '1.2.3（精确版本）',          'Maven 默认不做语义化版本浮动'],
    ['npm scripts',        'Maven lifecycle phases',    'validate→compile→test→package→install→deploy'],
  ];

  const table = compareCard(rows);

  const diffsHtml = `
    <p><strong>1. 依赖不在项目目录里</strong><br>
    Maven 将所有依赖缓存在 <code>~/.m2/repository/</code>，是机器级别的全局缓存。Java 项目 clone 下来后看不到任何依赖文件夹，也无需在 <code>.gitignore</code> 中排除它们——这与 <code>node_modules/</code> 必须在 <code>.gitignore</code> 中的前端习惯截然不同。</p>
    <p><strong>2. 生命周期是固定的</strong><br>
    Maven 内置 6 个阶段：<code>validate → compile → test → package → install → deploy</code>。执行 <code>mvn package</code> 时，Maven 会自动依次执行所有前置阶段，无需像 <code>npm scripts</code> 那样手动用 <code>&amp;&amp;</code> 串联命令。插件（Plugin）绑定到特定阶段，扩展能力而不破坏生命周期。</p>
    <p><strong>3. 坐标系统（GAV）</strong><br>
    npm 用 <code>@scope/name@version</code> 标识包，Maven 用 <strong>GAV 三元组</strong>：<code>groupId:artifactId:version</code>，例如 <code>org.springframework.boot:spring-boot-starter-web:3.2.0</code>。<code>groupId</code> 通常是组织的反向域名，<code>artifactId</code> 是具体模块名，<code>version</code> 是精确版本号。</p>`;

  const pkgJson = `{
  "name": "my-app",
  "version": "1.0.0",
  "dependencies": {
    "express": "^4.18.2",
    "axios": "^1.6.0"

// ── Render engine ─────────────────────────────────────────────────────────────

const renderers = {
  'maven-vs-npm': renderMavenVsNpm,
};

function renderArticle(t) {
  const el = document.createElement('div');
  el.className = 'article';
  el.id = 'article-' + t.id;
  const fn = renderers[t.id];
  if (!fn) { console.warn('No renderer for topic:', t.id); return; }
  el.innerHTML = fn(t);
  document.getElementById('article-wrapper').appendChild(el);
}

// ── Build sidebar nav ─────────────────────────────────────────────────────────

const sidebarNav = document.getElementById('sidebar-nav');
const groups = [...new Set(topics.map(t => t.group))];

groups.forEach(group => {
  const groupEl = document.createElement('div');
  groupEl.className = 'nav-group';

  const label = document.createElement('div');
  label.className = 'nav-group-label';
  label.textContent = group;
  groupEl.appendChild(label);

  topics.filter(t => t.group === group).forEach(t => {
    const item = document.createElement('div');
    item.className = 'nav-item';
    item.dataset.id = t.id;
    item.innerHTML = `<span class="nav-item-icon">${t.icon}</span>${t.name}`;
    item.addEventListener('click', () => selectTopic(t.id));
    groupEl.appendChild(item);
  });

  sidebarNav.appendChild(groupEl);
});

// ── Render all articles ───────────────────────────────────────────────────────

topics.forEach(renderArticle);
document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));

// ── Navigation ────────────────────────────────────────────────────────────────

function selectTopic(id) {
  const t = topics.find(x => x.id === id);
  if (!t) return;

  document.querySelectorAll('.nav-item').forEach(el =>
    el.classList.toggle('active', el.dataset.id === id));
  document.querySelectorAll('.article').forEach(el =>
    el.classList.toggle('active', el.id === 'article-' + id));

  document.getElementById('content-header-name').textContent = t.name;
  document.getElementById('mobile-topbar-title').textContent = t.name;
  document.getElementById('article-wrapper').scrollTop = 0;
  closeSidebar();
}

// ── Mobile sidebar ────────────────────────────────────────────────────────────

const sidebarEl = document.getElementById('sidebar-el');
const sidebarOverlay = document.getElementById('sidebar-overlay');
const mobileTopbar = document.getElementById('mobile-topbar');
const menuToggleTop = document.getElementById('menu-toggle-top');
const sidebarClose = document.getElementById('sidebar-close');
const mq = window.matchMedia('(max-width: 700px)');

function openSidebar()  { sidebarEl.classList.add('open');    sidebarOverlay.classList.add('visible'); }
function closeSidebar() { sidebarEl.classList.remove('open'); sidebarOverlay.classList.remove('visible'); }

menuToggleTop.addEventListener('click', openSidebar);
sidebarClose.addEventListener('click', closeSidebar);
sidebarOverlay.addEventListener('click', closeSidebar);

function applyMobileLayout(isMobile) {
  mobileTopbar.style.display = isMobile ? 'flex' : 'none';
  sidebarClose.style.display = isMobile ? 'flex' : 'none';
  if (!isMobile) closeSidebar();
}

mq.addEventListener('change', e => applyMobileLayout(e.matches));
applyMobileLayout(mq.matches);

// Init: select first topic
selectTopic(topics[0].id);
</script>
</body>
</html>
