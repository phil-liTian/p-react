<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p-react · 服务器部署指南</title>
  <link rel="icon" href="/public/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --sidebar-w: 260px;
      --bg-base: #0d1117;
      --bg-elevated: #161b22;
      --bg-overlay: #1c2128;
      --border: #21262d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #484f58;
      --accent: #7c3aed;
      --accent-light: #a78bfa;
      --accent-glow: rgba(124, 58, 237, 0.15);
      --green: #3fb950;
      --green-glow: rgba(63, 185, 80, 0.12);
      --blue: #58a6ff;
      --blue-glow: rgba(88, 166, 255, 0.12);
      --orange: #f0883e;
      --orange-glow: rgba(240, 136, 62, 0.12);
      --yellow: #d29922;
      --yellow-glow: rgba(210, 153, 34, 0.12);
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-code: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-ui);
      background: var(--bg-base);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    .app { display: flex; height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--bg-base);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 18px 16px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo-hexagon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .logo-text { font-size: 15px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.3px; }

    .logo-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--green);
      background: var(--green-glow);
      border: 1px solid rgba(63, 185, 80, 0.3);
      border-radius: 4px;
      padding: 1px 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 2px; }

    .nav-group { margin-bottom: 4px; }

    .nav-group-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 12px 16px 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 16px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      position: relative;
      color: var(--text-secondary);
      font-size: 13.5px;
    }

    .nav-item:hover { background: var(--bg-overlay); color: var(--text-primary); }

    .nav-item.active {
      background: var(--accent-glow);
      color: var(--accent-light);
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 3px; bottom: 3px;
      width: 3px;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }

    .nav-icon {
      font-size: 14px;
      width: 18px;
      flex-shrink: 0;
      text-align: center;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .back-link:hover { color: var(--text-secondary); border-color: var(--text-secondary); background: var(--bg-overlay); }

    /* ── Content ── */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-elevated);
    }

    .content-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 20px;
      height: 40px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .content-header-icon { font-size: 12px; color: var(--text-muted); font-family: var(--font-code); }
    .content-header-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
    .content-header-dot { color: var(--text-muted); font-size: 11px; }
    .content-header-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .content-header-spacer { flex: 1; }

    .content-header-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 7px;
    }

    /* ── Article ── */
    .article-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 32px 36px 48px;
    }

    .article-wrapper::-webkit-scrollbar { width: 8px; }
    .article-wrapper::-webkit-scrollbar-track { background: transparent; }
    .article-wrapper::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }
    .article-wrapper::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

    .page { display: none; }
    .page.active { display: block; }

    /* ── Page header ── */
    .page-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 20px;
    }

    .page-icon {
      font-size: 28px;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .page-meta { flex: 1; }

    .page-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .page-tags { display: flex; gap: 6px; flex-wrap: wrap; }

    .tag {
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      padding: 2px 8px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .tag-info { color: var(--blue); background: var(--blue-glow); border: 1px solid rgba(88,166,255,0.25); }
    .tag-success { color: var(--green); background: var(--green-glow); border: 1px solid rgba(63,185,80,0.25); }
    .tag-warning { color: var(--yellow); background: var(--yellow-glow); border: 1px solid rgba(210,153,34,0.25); }
    .tag-orange { color: var(--orange); background: var(--orange-glow); border: 1px solid rgba(240,136,62,0.25); }

    .page-divider { height: 1px; background: var(--border); margin-bottom: 24px; }

    /* ── Section ── */
    .section { margin-bottom: 28px; }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .section-body {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.8;
    }

    .section-body p { margin-bottom: 10px; }
    .section-body p:last-child { margin-bottom: 0; }
    .section-body strong { color: var(--text-primary); font-weight: 600; }

    .section-body code {
      font-family: var(--font-code);
      font-size: 12px;
      background: var(--bg-overlay);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      color: var(--accent-light);
    }

    /* ── Sub-section ── */
    .sub-section { margin-bottom: 20px; }

    .sub-section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-light);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Code blocks ── */
    .code-block-wrap {
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .code-block-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: var(--bg-overlay);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-family: var(--font-code);
    }

    .code-block-label-text { color: var(--text-secondary); }

    .code-block-wrap pre {
      margin: 0;
      padding: 16px 18px;
      background: var(--bg-base) !important;
      overflow-x: auto;
    }

    .code-block-wrap pre code {
      font-family: var(--font-code) !important;
      font-size: 12px !important;
      line-height: 1.7 !important;
      background: none !important;
      border: none !important;
      padding: 0 !important;
      color: var(--text-primary);
    }

    .code-block-wrap pre .cm { color: var(--text-muted); }
    .code-block-wrap pre .kw { color: var(--accent-light); }
    .code-block-wrap pre .st { color: var(--green); }
    .code-block-wrap pre .cmd { color: var(--orange); }

    /* ── Info / Warning boxes ── */
    .rule-box {
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 14px;
      border-left: 3px solid;
      font-size: 13.5px;
      line-height: 1.7;
    }

    .rule-box-info { background: var(--blue-glow); border-color: var(--blue); color: #a0c8ff; }
    .rule-box-warning { background: var(--yellow-glow); border-color: var(--yellow); color: #f0c070; }
    .rule-box-success { background: var(--green-glow); border-color: var(--green); color: #90dca0; }
    .rule-box-orange { background: var(--orange-glow); border-color: var(--orange); color: #f8c090; }

    .rule-box strong { color: inherit; font-weight: 700; }
    .rule-box code {
      font-family: var(--font-code);
      font-size: 11.5px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      padding: 1px 5px;
    }

    /* ── Step list ── */
    .step-list { list-style: none; }

    .step-list li {
      display: flex;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .step-list li:last-child { border-bottom: none; }

    .step-num {
      font-family: var(--font-code);
      font-size: 11px;
      color: var(--text-muted);
      width: 20px;
      flex-shrink: 0;
      padding-top: 3px;
    }

    /* ── Mobile ── */
    .menu-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .menu-toggle:hover { background: var(--bg-overlay); color: var(--text-primary); }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 99;
    }
    .sidebar-overlay.visible { display: block; }

    @media (max-width: 700px) {
      body { overflow: hidden; }
      .menu-toggle { display: flex; }
      .app { flex-direction: column; }

      .sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: 260px;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }
      .sidebar.open { transform: translateX(0); }

      .mobile-topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        height: 48px;
        background: var(--bg-base);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .mobile-topbar-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .content { height: calc(100vh - 48px); }
      .article-wrapper { padding: 20px 16px 40px; }
      .nav-item { padding: 11px 16px; font-size: 14px; }
    }

    /* ── Filter Modal ── */
    .filter-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 10px; background: transparent;
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text-secondary); font-size: 12px;
      font-family: var(--font-ui); cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .filter-btn:hover { border-color: var(--text-secondary); color: var(--text-primary); background: var(--bg-overlay); }
    .filter-btn-kbd {
      font-size: 10px; color: var(--text-muted);
      background: var(--bg-overlay); border: 1px solid var(--border);
      border-radius: 3px; padding: 0 4px; font-family: var(--font-code);
    }
    .filter-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); z-index: 200;
      align-items: flex-start; justify-content: center; padding-top: 80px;
    }
    .filter-overlay.visible { display: flex; }
    .filter-modal {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 12px; width: 540px; max-width: calc(100vw - 32px);
      max-height: calc(100vh - 120px); display: flex; flex-direction: column;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6); overflow: hidden;
    }
    .filter-search-wrap {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
    }
    .filter-search-icon { font-size: 14px; color: var(--text-muted); flex-shrink: 0; }
    .filter-search-input {
      flex: 1; background: transparent; border: none; outline: none;
      font-size: 14px; color: var(--text-primary); font-family: var(--font-ui);
    }
    .filter-search-input::placeholder { color: var(--text-muted); }
    .filter-results { overflow-y: auto; padding: 8px 0; flex: 1; min-height: 200px; }
    .filter-results::-webkit-scrollbar { width: 4px; }
    .filter-results::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 2px; }
    .filter-group-label {
      font-size: 10px; font-weight: 600; color: var(--text-muted);
      letter-spacing: 0.8px; text-transform: uppercase; padding: 8px 16px 4px;
    }
    .filter-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px; cursor: pointer;
      font-size: 13.5px; color: var(--text-secondary);
      transition: background 0.1s, color 0.1s;
    }
    .filter-item:hover, .filter-item.highlighted { background: var(--accent-glow); color: var(--accent-light); }
    .filter-item-icon { font-size: 14px; flex-shrink: 0; width: 18px; text-align: center; }
    .filter-item-name { flex: 1; }
    .filter-item-page { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
    .filter-empty { padding: 32px 16px; text-align: center; color: var(--text-muted); font-size: 13px; }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="app">
  <!-- Mobile Topbar -->
  <div class="mobile-topbar" id="mobile-topbar" style="display:none">
    <button class="menu-toggle" id="menu-toggle-top" aria-label="打开菜单">☰</button>
    <span class="mobile-topbar-title" id="mobile-topbar-title">部署指南</span>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar-el">
    <div class="sidebar-logo">
      <div class="logo-hexagon">p</div>
      <span class="logo-text">p-react</span>
      <span class="logo-badge">deploy</span>
      <div style="flex:1"></div>
      <button class="menu-toggle" id="sidebar-close" aria-label="关闭菜单" style="display:none">✕</button>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <a class="back-link" href="hub.html">← 返回 Hub</a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="content">
    <div class="content-header">
      <span class="content-header-icon">🚀</span>
      <span class="content-header-label">部署指南</span>
      <span class="content-header-dot">·</span>
      <span class="content-header-name" id="content-header-name">选择左侧条目</span>
      <div class="content-header-spacer"></div>
      <button class="filter-btn" id="filter-btn">⌘ 筛选 <span class="filter-btn-kbd">K</span></button>
      <span class="content-header-badge" id="content-header-badge"></span>
    </div>

    <div class="article-wrapper" id="article-wrapper">
      <!-- pages injected here -->
    </div>
  </main>
</div>

<div class="filter-overlay" id="filter-overlay">
  <div class="filter-modal">
    <div class="filter-search-wrap">
      <span class="filter-search-icon">🔍</span>
      <input class="filter-search-input" id="filter-search-input" placeholder="搜索部署方案..." autocomplete="off" spellcheck="false" />
    </div>
    <div class="filter-results" id="filter-results"></div>
  </div>
</div>

<script src="/global-topics.js"></script>
<script>
// ── Page data ──────────────────────────────────────────────────────────
const pages = [
  {
    id: 'node-pm2',
    name: 'Node.js + PM2',
    group: '部署',
    badge: 'Node.js',
    icon: '🚀',
    tags: [{ label: 'Node.js', type: 'success' }, { label: 'PM2', type: 'info' }, { label: '进程管理', type: 'info' }],
    summary: '使用 nvm 管理 Node.js 版本，配合 PM2 实现进程守护、日志管理、开机自启和集群模式。',
    sections: [
      {
        title: '安装 Node.js',
        subs: [
          {
            title: '使用 nvm 管理（推荐）',
            code: `<span class="cm"># 安装 nvm</span>
<span class="cmd">curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash</span>

<span class="cm"># 重新加载 shell 配置</span>
<span class="cmd">source ~/.bashrc</span>

<span class="cm"># 安装 LTS 版本</span>
<span class="cmd">nvm install --lts</span>
<span class="cmd">nvm use --lts</span>
<span class="cmd">nvm alias default lts/*</span>

<span class="cm"># 验证</span>
<span class="cmd">node -v && npm -v</span>`,
            label: 'bash'
          },
          {
            title: '直接安装（Ubuntu / CentOS）',
            code: `<span class="cm"># Ubuntu / Debian</span>
<span class="cmd">curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -</span>
<span class="cmd">sudo apt-get install -y nodejs</span>

<span class="cm"># CentOS / RHEL</span>
<span class="cmd">curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash -</span>
<span class="cmd">sudo yum install -y nodejs</span>`,
            label: 'bash'
          }
        ]
      },
      {
        title: '安装与使用 PM2',
        subs: [
          {
            title: '安装 PM2',
            code: `<span class="cmd">npm install -g pm2</span>
<span class="cmd">pm2 --version</span>`,
            label: 'bash'
          },
          {
            title: '常用命令',
            code: `<span class="cm"># 启动应用</span>
<span class="cmd">pm2 start npm --name "myapp" -- start</span>
<span class="cmd">pm2 start dist/index.js --name "myapp"</span>

<span class="cm"># 查看 / 日志 / 重启 / 停止 / 删除</span>
<span class="cmd">pm2 list</span>
<span class="cmd">pm2 logs myapp --lines 100</span>
<span class="cmd">pm2 restart myapp</span>
<span class="cmd">pm2 stop myapp</span>
<span class="cmd">pm2 delete myapp</span>

<span class="cm"># 持久化：保存进程列表 + 开机自启</span>
<span class="cmd">pm2 save</span>
<span class="cmd">pm2 startup</span>`,
            label: 'bash'
          },
          {
            title: '集群模式（多核负载均衡）',
            code: `<span class="cmd">pm2 start app.js -i max      </span><span class="cm"># 自动按 CPU 核数创建实例</span>
<span class="cmd">pm2 start app.js -i 4</span>`,
            label: 'bash'
          },
          {
            title: 'ecosystem.config.js',
            code: `<span class="kw">module.exports</span> = {
  apps: [{
    name: <span class="st">'myapp'</span>,
    script: <span class="st">'./dist/index.js'</span>,
    instances: <span class="st">'max'</span>,
    exec_mode: <span class="st">'cluster'</span>,
    env: { NODE_ENV: <span class="st">'production'</span>, PORT: <span class="st">'3000'</span> },
    error_file: <span class="st">'./logs/error.log'</span>,
    out_file: <span class="st">'./logs/out.log'</span>,
    max_memory_restart: <span class="st">'500M'</span>,
    autorestart: true,
    watch: false
  }]
};`,
            label: 'ecosystem.config.js'
          }
        ]
      },
      {
        title: '部署流程',
        steps: [
          '本地打包项目：<code>npm run build</code>',
          '通过 scp 或 git 将代码上传到服务器',

<span class="kw">K8s 负责：</span>

<span class="st">3. 多机部署要手动 ssh + docker run</span>
<span class="st">4. 滚动发布、回滚全靠人肉操作</span>

        │     └── kube-controller-manager
        └── Worker（工作节点）
              └── <span class="kw">Pod</span>            <span class="cm"># K8s 最小调度单位</span>
                    └── Container(s) <span class="cm"># Pod 内容器共享网络和存储</span>

<span class="cm"># 关键：K8s 不直接调度容器，而是调度 Pod</span>
<span class="cm"># 一个 Pod 可含多个容器，共享同一个 IP 和挂载</span>`,
            label: '架构层次'
          },
          {
            title: '工作负载与网络对象',
            code: `<span class="kw">Deployment</span>     <span class="cm"># 管理 Pod 副本，支持滚动发布（无状态）</span>
<span class="kw">StatefulSet</span>    <span class="cm"># 有状态应用（数据库、MQ），固定 Pod 名 + 存储</span>
<span class="kw">DaemonSet</span>      <span class="cm"># 每个节点跑一个副本（日志/监控 agent）</span>
<span class="kw">Job / CronJob</span>  <span class="cm"># 一次性 / 定时任务</span>

<span class="kw">Service</span>        <span class="cm"># 给一组 Pod 一个稳定 IP + DNS 名，负载均衡</span>
<span class="kw">Ingress</span>        <span class="cm"># 七层路由，把 HTTP 流量按域名/路径分发到 Service</span>
<span class="kw">ConfigMap</span>      <span class="cm"># 注入配置（非敏感）</span>
<span class="kw">Secret</span>         <span class="cm"># 注入敏感信息（密码、证书）</span>
<span class="kw">Volume / PVC</span>   <span class="cm"># 持久化存储声明</span>`,
            label: '常用资源对象'
          },
          {
            title: '一个最小 Deployment + Service',
            code: `<span class="cm"># api-deploy.yaml</span>
<span class="kw">apiVersion</span>: apps/v1
<span class="kw">kind</span>: Deployment
<span class="kw">metadata</span>:
  <span class="kw">name</span>: api
<span class="kw">spec</span>:
  <span class="kw">replicas</span>: <span class="st">3</span>
  <span class="kw">selector</span>:
    <span class="kw">matchLabels</span>: { app: api }
  <span class="kw">template</span>:
    <span class="kw">metadata</span>:
      <span class="kw">labels</span>: { app: api }
    <span class="kw">spec</span>:
      <span class="kw">containers</span>:
        - <span class="kw">name</span>: api
          <span class="kw">image</span>: myapp:v1
          <span class="kw">ports</span>: [{ containerPort: <span class="st">8080</span> }]
          <span class="kw">resources</span>:
            <span class="kw">requests</span>: { cpu: <span class="st">100m</span>, memory: <span class="st">128Mi</span> }
            <span class="kw">limits</span>:   { cpu: <span class="st">500m</span>, memory: <span class="st">512Mi</span> }
---
<span class="kw">apiVersion</span>: v1
<span class="kw">kind</span>: Service
<span class="kw">metadata</span>:
  <span class="kw">name</span>: api
<span class="kw">spec</span>:
  <span class="kw">type</span>: ClusterIP
  <span class="kw">selector</span>: { app: api }   <span class="cm"># 流量转发到带 app=api 标签的 Pod</span>
  <span class="kw">ports</span>:
    - port: <span class="st">80</span>
      targetPort: <span class="st">8080</span>`,
            label: 'api-deploy.yaml'
          }
        ]
      },
      {
        title: 'K8s vs Docker / Swarm / Nomad',
        subs: [
          {
            title: '能力对比',
            code: `<span class="kw">能力              Docker   Swarm    K8s        Nomad</span>
调度              单机      集群     集群        集群
自愈              ❌        ✅       ✅          ✅
弹性伸缩          ❌        基础     强（HPA）   基础
滚动发布          ❌        ✅       ✅          ✅
服务发现          ❌        ✅       ✅ + DNS    ✅
存储卷            ✅        ✅       ✅（PVC）   ✅
生态              大        弱       极大        中
学习曲线          低        低       高          中

<span class="cm"># 结论：单机开发用 Docker；多机生产用 K8s（生态、招人都占优）</span>`,
            label: '横向对比'
          }
        ]
      },
      {
        title: '典型使用场景',
        subs: [
          {
            title: '什么时候该上 K8s',
            code: `<span class="kw">✅ 适合：</span>
  <span class="st">微服务数量 > 10，且需要频繁发布</span>
  <span class="st">需要根据流量自动扩缩容（电商大促、AI 推理）</span>
  <span class="st">多团队共用一套基础设施，需要资源隔离与配额</span>
  <span class="st">混合云 / 多云部署，避免被单一云商锁定</span>

<span class="kw">❌ 不适合：</span>
  <span class="st">单个 monolith + 一台服务器就够的小项目</span>
  <span class="st">没有专职运维，学习成本收不回来</span>
  <span class="st">强状态依赖的传统中间件（K8s 能跑但运维成本高）</span>`,
            label: '场景判断'
          }
        ]
      },
      {
        title: '上手路径',
        subs: [
          {
            title: '从 0 到 1 的推荐顺序',
            code: `<span class="cm"># 1. 先把 Docker 用熟：会写 Dockerfile、会用 docker compose</span>

<span class="cmd">kubectl scale deploy api --replicas=5</span>
<span class="cmd">kubectl rollout undo deploy api</span>  <span class="cm"># 回滚</span>

            label: '学习路径'
          }
        ]
      }
    ],
    rules: [
      { type: 'info', text: 'K8s 调度的最小单位是 <code>Pod</code> 而不是容器；一个 Pod 内的容器共享网络命名空间和存储卷，常用于 sidecar 模式。' },
      { type: 'success', text: '声明式 API 是 K8s 的核心思想：你写"期望状态"（YAML），控制器持续把"实际状态"向"期望状态"收敛，无需手动操作。' },
      { type: 'warning', text: 'K8s 学习曲线陡峭，单机小项目用 Docker Compose 即可；K8s 的运维成本只有在大规模、多服务、频繁发布时才划算。' }
    ]

// ── Build sidebar nav ────────────────────────────────────────────────
const sidebarNav = document.getElementById('sidebar-nav');
const groups = [...new Set(pages.map(p => p.group))];

const groupIcon = { '部署': '📦', '数据库安装': '🗄️', '中间件安装': '📨', '容器编排': '☸️' };

groups.forEach(group => {
  const groupEl = document.createElement('div');
  groupEl.className = 'nav-group';

  const label = document.createElement('div');
  label.className = 'nav-group-label';
  label.textContent = group;
  groupEl.appendChild(label);

  pages.filter(p => p.group === group).forEach(p => {
    const item = document.createElement('div');
    item.className = 'nav-item';
    item.dataset.id = p.id;
    item.innerHTML = `<span class="nav-icon">${p.icon}</span>${p.name}`;
    item.addEventListener('click', () => selectPage(p.id));
    groupEl.appendChild(item);
  });

  sidebarNav.appendChild(groupEl);
});

// ── Render page ──────────────────────────────────────────────────────
function renderPage(p) {
  const el = document.createElement('div');
  el.className = 'page';
  el.id = 'page-' + p.id;

  const tagsHtml = p.tags.map(t => `<span class="tag tag-${t.type}">${t.label}</span>`).join('');

  let sectionsHtml = '';
  p.sections.forEach(sec => {
    let bodyHtml = '';

    if (sec.subs) {
      sec.subs.forEach(sub => {
        bodyHtml += `
          <div class="sub-section">
            <div class="sub-section-title">${sub.title}</div>
            <div class="code-block-wrap">
              <div class="code-block-label">
                <span class="code-block-label-text">${sub.label}</span>
              </div>
              <pre><code>${sub.code}</code></pre>
            </div>
          </div>`;
      });
    }

    if (sec.steps) {
      const stepsHtml = sec.steps.map((s, i) =>
        `<li><span class="step-num">${String(i + 1).padStart(2, '0')}</span><span>${s}</span></li>`
      ).join('');
      bodyHtml += `<ul class="step-list">${stepsHtml}</ul>`;
    }

    if (sec.deployScript) {
      bodyHtml += `
        <div class="sub-section" style="margin-top:14px">
          <div class="sub-section-title">完整部署脚本</div>
          <div class="code-block-wrap">
            <div class="code-block-label"><span class="code-block-label-text">deploy.sh</span></div>
            <pre><code>${sec.deployScript}</code></pre>
          </div>
        </div>`;
    }

    sectionsHtml += `
      <div class="section">
        <div class="section-title">${sec.title}</div>
        <div class="section-body">${bodyHtml}</div>
      </div>`;
  });

  const rulesHtml = p.rules.map(r =>
    `<div class="rule-box rule-box-${r.type}">${r.text}</div>`
  ).join('');

  el.innerHTML = `
    <div class="page-header">
      <div class="page-icon">${p.icon}</div>
      <div class="page-meta">
        <div class="page-title">${p.name}</div>
        <div class="page-tags">${tagsHtml}</div>
      </div>
    </div>
    <div class="page-divider"></div>

    <div class="section">
      <div class="section-title">概述</div>
      <div class="section-body"><p>${p.summary}</p></div>
    </div>

    ${sectionsHtml}

    <div class="section">
      <div class="section-title">注意事项</div>
      ${rulesHtml}
    </div>
  `;

  document.getElementById('article-wrapper').appendChild(el);
}

pages.forEach(renderPage);

// ── Select page ──────────────────────────────────────────────────────
function selectPage(id) {
  const p = pages.find(x => x.id === id);
  if (!p) return;

  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  document.querySelectorAll('.page').forEach(el => {
    el.classList.toggle('active', el.id === 'page-' + id);
  });

  document.getElementById('content-header-name').textContent = p.name;

  const badge = document.getElementById('content-header-badge');
  badge.textContent = p.badge;
  badge.style.color = '';
  badge.style.borderColor = '';

  document.getElementById('article-wrapper').scrollTop = 0;
  document.getElementById('mobile-topbar-title').textContent = p.name;
  closeSidebar();
}

// ── Mobile sidebar ───────────────────────────────────────────────────
const sidebarEl = document.getElementById('sidebar-el');
const sidebarOverlay = document.getElementById('sidebar-overlay');
const mobileTopbar = document.getElementById('mobile-topbar');
const menuToggleTop = document.getElementById('menu-toggle-top');
const sidebarClose = document.getElementById('sidebar-close');
const mq = window.matchMedia('(max-width: 700px)');

function openSidebar() { sidebarEl.classList.add('open'); sidebarOverlay.classList.add('visible'); }
function closeSidebar() { sidebarEl.classList.remove('open'); sidebarOverlay.classList.remove('visible'); }

menuToggleTop.addEventListener('click', openSidebar);
sidebarClose.addEventListener('click', closeSidebar);
sidebarOverlay.addEventListener('click', closeSidebar);

function applyMobileLayout(isMobile) {
  mobileTopbar.style.display = isMobile ? 'flex' : 'none';
  sidebarClose.style.display = isMobile ? 'flex' : 'none';
  if (!isMobile) closeSidebar();
}

mq.addEventListener('change', e => applyMobileLayout(e.matches));
applyMobileLayout(mq.matches);

// ── Init: select first page ──────────────────────────────────────────
const _urlTopic = new URLSearchParams(location.search).get('topic');
selectPage(_urlTopic || pages[0].id);

initFilterModal('deployment', selectPage);
</script>
</body>
