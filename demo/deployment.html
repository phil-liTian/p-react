<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p-react · 服务器部署指南</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --sidebar-w: 260px;
      --bg-base: #0d1117;
      --bg-elevated: #161b22;
      --bg-overlay: #1c2128;
      --border: #21262d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #484f58;
      --accent: #7c3aed;
      --accent-light: #a78bfa;
      --accent-glow: rgba(124, 58, 237, 0.15);
      --green: #3fb950;
      --green-glow: rgba(63, 185, 80, 0.12);
      --blue: #58a6ff;
      --blue-glow: rgba(88, 166, 255, 0.12);
      --orange: #f0883e;
      --orange-glow: rgba(240, 136, 62, 0.12);
      --yellow: #d29922;
      --yellow-glow: rgba(210, 153, 34, 0.12);
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-code: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-ui);
      background: var(--bg-base);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    .app { display: flex; height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--bg-base);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 18px 16px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo-hexagon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .logo-text { font-size: 15px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.3px; }

    .logo-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--green);
      background: var(--green-glow);
      border: 1px solid rgba(63, 185, 80, 0.3);
      border-radius: 4px;
      padding: 1px 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 2px; }

    .nav-group { margin-bottom: 4px; }

    .nav-group-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 12px 16px 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 16px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      position: relative;
      color: var(--text-secondary);
      font-size: 13.5px;
    }

    .nav-item:hover { background: var(--bg-overlay); color: var(--text-primary); }

    .nav-item.active {
      background: var(--accent-glow);
      color: var(--accent-light);
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 3px; bottom: 3px;
      width: 3px;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }

    .nav-icon {
      font-size: 14px;
      width: 18px;
      flex-shrink: 0;
      text-align: center;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .back-link:hover { color: var(--text-secondary); border-color: var(--text-secondary); background: var(--bg-overlay); }

    /* ── Content ── */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-elevated);
    }

    .content-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 20px;
      height: 40px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .content-header-icon { font-size: 12px; color: var(--text-muted); font-family: var(--font-code); }
    .content-header-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
    .content-header-dot { color: var(--text-muted); font-size: 11px; }
    .content-header-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .content-header-spacer { flex: 1; }

    .content-header-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 7px;
    }

    /* ── Article ── */
    .article-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 32px 36px 48px;
    }

    .article-wrapper::-webkit-scrollbar { width: 8px; }
    .article-wrapper::-webkit-scrollbar-track { background: transparent; }
    .article-wrapper::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }
    .article-wrapper::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

    .page { display: none; }
    .page.active { display: block; }

    /* ── Page header ── */
    .page-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 20px;
    }

    .page-icon {
      font-size: 28px;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .page-meta { flex: 1; }

    .page-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .page-tags { display: flex; gap: 6px; flex-wrap: wrap; }

    .tag {
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      padding: 2px 8px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .tag-info { color: var(--blue); background: var(--blue-glow); border: 1px solid rgba(88,166,255,0.25); }
    .tag-success { color: var(--green); background: var(--green-glow); border: 1px solid rgba(63,185,80,0.25); }
    .tag-warning { color: var(--yellow); background: var(--yellow-glow); border: 1px solid rgba(210,153,34,0.25); }
    .tag-orange { color: var(--orange); background: var(--orange-glow); border: 1px solid rgba(240,136,62,0.25); }

    .page-divider { height: 1px; background: var(--border); margin-bottom: 24px; }

    /* ── Section ── */
    .section { margin-bottom: 28px; }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .section-body {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.8;
    }

    .section-body p { margin-bottom: 10px; }
    .section-body p:last-child { margin-bottom: 0; }
    .section-body strong { color: var(--text-primary); font-weight: 600; }

    .section-body code {
      font-family: var(--font-code);
      font-size: 12px;
      background: var(--bg-overlay);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      color: var(--accent-light);
    }

    /* ── Sub-section ── */
    .sub-section { margin-bottom: 20px; }

    .sub-section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-light);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Code blocks ── */
    .code-block-wrap {
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .code-block-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: var(--bg-overlay);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-family: var(--font-code);
    }

    .code-block-label-text { color: var(--text-secondary); }

    .code-block-wrap pre {
      margin: 0;
      padding: 16px 18px;
      background: var(--bg-base) !important;
      overflow-x: auto;
    }

    .code-block-wrap pre code {
      font-family: var(--font-code) !important;
      font-size: 12px !important;
      line-height: 1.7 !important;
      background: none !important;
      border: none !important;
      padding: 0 !important;
      color: var(--text-primary);
    }

    .code-block-wrap pre .cm { color: var(--text-muted); }
    .code-block-wrap pre .kw { color: var(--accent-light); }
    .code-block-wrap pre .st { color: var(--green); }
    .code-block-wrap pre .cmd { color: var(--orange); }

    /* ── Info / Warning boxes ── */
    .rule-box {
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 14px;
      border-left: 3px solid;
      font-size: 13.5px;
      line-height: 1.7;
    }

    .rule-box-info { background: var(--blue-glow); border-color: var(--blue); color: #a0c8ff; }
    .rule-box-warning { background: var(--yellow-glow); border-color: var(--yellow); color: #f0c070; }
    .rule-box-success { background: var(--green-glow); border-color: var(--green); color: #90dca0; }
    .rule-box-orange { background: var(--orange-glow); border-color: var(--orange); color: #f8c090; }

    .rule-box strong { color: inherit; font-weight: 700; }
    .rule-box code {
      font-family: var(--font-code);
      font-size: 11.5px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      padding: 1px 5px;
    }

    /* ── Step list ── */
    .step-list { list-style: none; }

    .step-list li {
      display: flex;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .step-list li:last-child { border-bottom: none; }

    .step-num {
      font-family: var(--font-code);
      font-size: 11px;
      color: var(--text-muted);
      width: 20px;
      flex-shrink: 0;
      padding-top: 3px;
    }

    /* ── Mobile ── */
    .menu-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .menu-toggle:hover { background: var(--bg-overlay); color: var(--text-primary); }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 99;
    }
    .sidebar-overlay.visible { display: block; }

    @media (max-width: 700px) {
      body { overflow: hidden; }
      .menu-toggle { display: flex; }
      .app { flex-direction: column; }

      .sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: 260px;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }
      .sidebar.open { transform: translateX(0); }

      .mobile-topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        height: 48px;
        background: var(--bg-base);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .mobile-topbar-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .content { height: calc(100vh - 48px); }
      .article-wrapper { padding: 20px 16px 40px; }
      .nav-item { padding: 11px 16px; font-size: 14px; }
    }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="app">
  <!-- Mobile Topbar -->
  <div class="mobile-topbar" id="mobile-topbar" style="display:none">
    <button class="menu-toggle" id="menu-toggle-top" aria-label="打开菜单">☰</button>
    <span class="mobile-topbar-title" id="mobile-topbar-title">部署指南</span>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar-el">
    <div class="sidebar-logo">
      <div class="logo-hexagon">p</div>
      <span class="logo-text">p-react</span>
      <span class="logo-badge">deploy</span>
      <div style="flex:1"></div>
      <button class="menu-toggle" id="sidebar-close" aria-label="关闭菜单" style="display:none">✕</button>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <a class="back-link" href="hub.html">← 返回 Hub</a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="content">
    <div class="content-header">
      <span class="content-header-icon">🚀</span>
      <span class="content-header-label">部署指南</span>
      <span class="content-header-dot">·</span>
      <span class="content-header-name" id="content-header-name">选择左侧条目</span>
      <div class="content-header-spacer"></div>
      <span class="content-header-badge" id="content-header-badge"></span>
    </div>

    <div class="article-wrapper" id="article-wrapper">
      <!-- pages injected here -->
    </div>
  </main>
</div>

<script>
// ── Page data ──────────────────────────────────────────────────────────
const pages = [
  {
    id: 'node-pm2',
    name: 'Node.js + PM2',
    group: '部署',
    badge: 'Node.js',
    icon: '🚀',
    tags: [{ label: 'Node.js', type: 'success' }, { label: 'PM2', type: 'info' }, { label: '进程管理', type: 'info' }],
    summary: '使用 nvm 管理 Node.js 版本，配合 PM2 实现进程守护、日志管理、开机自启和集群模式。',
    sections: [
      {
        title: '安装 Node.js',
        subs: [
          {
            title: '使用 nvm 管理（推荐）',
            code: `<span class="cm"># 安装 nvm</span>
<span class="cmd">curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash</span>

<span class="cm"># 重新加载 shell 配置</span>
<span class="cmd">source ~/.bashrc</span>

<span class="cm"># 安装 LTS 版本</span>
<span class="cmd">nvm install --lts</span>
<span class="cmd">nvm use --lts</span>
<span class="cmd">nvm alias default lts/*</span>

<span class="cm"># 验证</span>
<span class="cmd">node -v && npm -v</span>`,
            label: 'bash'
          },
          {
            title: '直接安装（Ubuntu / CentOS）',
            code: `<span class="cm"># Ubuntu / Debian</span>
<span class="cmd">curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -</span>
<span class="cmd">sudo apt-get install -y nodejs</span>

<span class="cm"># CentOS / RHEL</span>
<span class="cmd">curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash -</span>
<span class="cmd">sudo yum install -y nodejs</span>`,
            label: 'bash'
          }
        ]
      },
      {
        title: '安装与使用 PM2',
        subs: [
          {
            title: '安装 PM2',
            code: `<span class="cmd">npm install -g pm2</span>
<span class="cmd">pm2 --version</span>`,
            label: 'bash'
          },
          {
            title: '常用命令',
            code: `<span class="cm"># 启动应用</span>
<span class="cmd">pm2 start npm --name "myapp" -- start</span>
<span class="cmd">pm2 start dist/index.js --name "myapp"</span>

<span class="cm"># 查看 / 日志 / 重启 / 停止 / 删除</span>
<span class="cmd">pm2 list</span>
<span class="cmd">pm2 logs myapp --lines 100</span>
<span class="cmd">pm2 restart myapp</span>
<span class="cmd">pm2 stop myapp</span>
<span class="cmd">pm2 delete myapp</span>

<span class="cm"># 持久化：保存进程列表 + 开机自启</span>
<span class="cmd">pm2 save</span>
<span class="cmd">pm2 startup</span>`,
            label: 'bash'
          },
          {
            title: '集群模式（多核负载均衡）',
            code: `<span class="cmd">pm2 start app.js -i max      </span><span class="cm"># 自动按 CPU 核数创建实例</span>
<span class="cmd">pm2 start app.js -i 4</span>`,
            label: 'bash'
          },
          {
            title: 'ecosystem.config.js',
            code: `<span class="kw">module.exports</span> = {
  apps: [{
    name: <span class="st">'myapp'</span>,
    script: <span class="st">'./dist/index.js'</span>,
    instances: <span class="st">'max'</span>,
    exec_mode: <span class="st">'cluster'</span>,
    env: { NODE_ENV: <span class="st">'production'</span>, PORT: <span class="st">'3000'</span> },
    error_file: <span class="st">'./logs/error.log'</span>,
    out_file: <span class="st">'./logs/out.log'</span>,
    max_memory_restart: <span class="st">'500M'</span>,
    autorestart: true,
    watch: false
  }]
};`,
            label: 'ecosystem.config.js'
          }
        ]
      },
      {
        title: '部署流程',
        steps: [
          '本地打包项目：<code>npm run build</code>',
          '通过 scp 或 git 将代码上传到服务器',
          '安装生产依赖：<code>npm install --production</code>',
          '启动服务：<code>pm2 start ecosystem.config.js</code>',
          '保存进程列表：<code>pm2 save</code>',
          '设置开机自启：<code>pm2 startup</code>，按提示执行生成的命令'
        ],
        deployScript: `<span class="cm">#!/bin/bash</span>
<span class="cm"># deploy.sh</span>

<span class="kw">APP_NAME</span>=<span class="st">"myapp"</span>
<span class="kw">APP_DIR</span>=<span class="st">"/var/www/myapp"</span>

<span class="cmd">cd</span> <span class="kw">$APP_DIR</span>
<span class="cmd">git pull origin main</span>
<span class="cmd">npm install</span>
<span class="cmd">npm run build</span>
<span class="cmd">pm2 restart</span> <span class="kw">$APP_NAME</span>`
      }
    ],
    rules: [
      { type: 'info', text: '使用 nvm 可以方便地在不同 Node.js 版本之间切换，推荐用于多项目服务器环境。' },
      { type: 'success', text: 'PM2 集群模式可以充分利用多核 CPU，零停机重载（<code>pm2 reload myapp</code>）适合生产更新。' }
    ]
  },

  {
    id: 'go-deploy',
    name: 'Go 项目部署',
    group: '部署',
    badge: 'Go',
    icon: '🐹',
    tags: [{ label: 'Go', type: 'success' }, { label: 'Systemd', type: 'info' }, { label: '交叉编译', type: 'info' }],
    summary: '安装 Go 运行环境，交叉编译二进制文件，使用 Systemd 进行进程管理和开机自启。',
    sections: [
      {
        title: '安装 Go',
        subs: [
          {
            title: '下载安装（以 1.22 为例）',
            code: `<span class="cm"># 下载 Go</span>
<span class="cmd">wget https://go.dev/dl/go1.22.0.linux-amd64.tar.gz</span>

<span class="cm"># 解压到 /usr/local</span>
<span class="cmd">sudo rm -rf /usr/local/go</span>
<span class="cmd">sudo tar -C /usr/local -xzf go1.22.0.linux-amd64.tar.gz</span>

<span class="cm"># 配置环境变量（追加到 ~/.bashrc）</span>
<span class="cmd">echo 'export PATH=$PATH:/usr/local/go/bin' >> ~/.bashrc</span>
<span class="cmd">echo 'export GOPATH=$HOME/go' >> ~/.bashrc</span>
<span class="cmd">echo 'export PATH=$PATH:$GOPATH/bin' >> ~/.bashrc</span>
<span class="cmd">source ~/.bashrc</span>

<span class="cm"># 验证</span>
<span class="cmd">go version</span>`,
            label: 'bash'
          },
          {
            title: '使用 gvm 版本管理（推荐）',
            code: `<span class="cmd">bash &lt;(curl -s -S -L https://raw.githubusercontent.com/moovweb/gvm/master/binscripts/gvm-installer)</span>
<span class="cmd">echo 'source $HOME/.gvm/scripts/gvm' >> ~/.zshrc</span>
<span class="cmd">source ~/.zshrc</span>

<span class="cm"># 安装并切换版本</span>
<span class="cmd">gvm install go1.22.5</span>
<span class="cmd">gvm use go1.22.5</span>`,
            label: 'bash'
          }
        ]
      },
      {
        title: '编译与部署',
        subs: [
          {
            title: '交叉编译（本地构建）',

  --data-dir=/var/lib/etcd-data \
  # 监听所有网卡，本机/其他服务都能访问

  # 注册给微服务的访问地址

      {
        title: 'Ubuntu / Debian 安装',
        subs: [

<span class="cmd">sudo systemctl enable redis</span>

<span class="cm"># 测试连接（应返回 PONG）</span>

          }

      {

        subs: [

<span class="cmd">sudo yum install redis -y</span>

<span class="cmd">sudo systemctl start redis</span>
<span class="cmd">sudo systemctl enable redis</span>
<span class="cmd">redis-cli ping</span>`,
            label: 'bash'
          }
        ]
      },
      {
        title: '配置远程访问与密码',
        subs: [
          {
            title: '修改 redis.conf',
            code: `<span class="cmd">sudo nano /etc/redis/redis.conf</span>

<span class="cm"># 修改绑定地址（允许所有 IP）</span>
<span class="st">bind 0.0.0.0</span>

<span class="cm"># 设置密码（推荐）</span>

      {

      { type: 'info', text: 'Redis 默认将数据持久化到 <code>/var/lib/redis/dump.rdb</code>，重启不会丢失数据；如需更高持久性，可开启 AOF 模式。' }

];

// ── Build sidebar nav ────────────────────────────────────────────────
const sidebarNav = document.getElementById('sidebar-nav');
const groups = [...new Set(pages.map(p => p.group))];

const groupIcon = { '部署': '📦', '数据库安装': '🗄️' };

groups.forEach(group => {
  const groupEl = document.createElement('div');
  groupEl.className = 'nav-group';

  const label = document.createElement('div');
  label.className = 'nav-group-label';
  label.textContent = group;
  groupEl.appendChild(label);

  pages.filter(p => p.group === group).forEach(p => {
    const item = document.createElement('div');
    item.className = 'nav-item';
    item.dataset.id = p.id;
    item.innerHTML = `<span class="nav-icon">${p.icon}</span>${p.name}`;
    item.addEventListener('click', () => selectPage(p.id));
    groupEl.appendChild(item);
  });

  sidebarNav.appendChild(groupEl);
});

// ── Render page ──────────────────────────────────────────────────────
function renderPage(p) {
  const el = document.createElement('div');
  el.className = 'page';
  el.id = 'page-' + p.id;

  const tagsHtml = p.tags.map(t => `<span class="tag tag-${t.type}">${t.label}</span>`).join('');

  let sectionsHtml = '';
  p.sections.forEach(sec => {
    let bodyHtml = '';

    if (sec.subs) {
      sec.subs.forEach(sub => {
        bodyHtml += `
          <div class="sub-section">
            <div class="sub-section-title">${sub.title}</div>
            <div class="code-block-wrap">
              <div class="code-block-label">
                <span class="code-block-label-text">${sub.label}</span>
              </div>
              <pre><code>${sub.code}</code></pre>
            </div>
          </div>`;
      });
    }

    if (sec.steps) {
      const stepsHtml = sec.steps.map((s, i) =>
        `<li><span class="step-num">${String(i + 1).padStart(2, '0')}</span><span>${s}</span></li>`
      ).join('');
      bodyHtml += `<ul class="step-list">${stepsHtml}</ul>`;
    }

    if (sec.deployScript) {
      bodyHtml += `
        <div class="sub-section" style="margin-top:14px">
          <div class="sub-section-title">完整部署脚本</div>
          <div class="code-block-wrap">
            <div class="code-block-label"><span class="code-block-label-text">deploy.sh</span></div>
            <pre><code>${sec.deployScript}</code></pre>
          </div>
        </div>`;
    }

    sectionsHtml += `
      <div class="section">
        <div class="section-title">${sec.title}</div>
        <div class="section-body">${bodyHtml}</div>
      </div>`;
  });

  const rulesHtml = p.rules.map(r =>
    `<div class="rule-box rule-box-${r.type}">${r.text}</div>`
  ).join('');

  el.innerHTML = `
    <div class="page-header">
      <div class="page-icon">${p.icon}</div>
      <div class="page-meta">
        <div class="page-title">${p.name}</div>
        <div class="page-tags">${tagsHtml}</div>
      </div>
    </div>
    <div class="page-divider"></div>

    <div class="section">
      <div class="section-title">概述</div>
      <div class="section-body"><p>${p.summary}</p></div>
    </div>

    ${sectionsHtml}

    <div class="section">
      <div class="section-title">注意事项</div>
      ${rulesHtml}
    </div>
  `;

  document.getElementById('article-wrapper').appendChild(el);
}

pages.forEach(renderPage);

// ── Select page ──────────────────────────────────────────────────────
function selectPage(id) {
  const p = pages.find(x => x.id === id);
  if (!p) return;

  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  document.querySelectorAll('.page').forEach(el => {
    el.classList.toggle('active', el.id === 'page-' + id);
  });

  document.getElementById('content-header-name').textContent = p.name;

  const badge = document.getElementById('content-header-badge');
  badge.textContent = p.badge;
  badge.style.color = '';
  badge.style.borderColor = '';

  document.getElementById('article-wrapper').scrollTop = 0;
  document.getElementById('mobile-topbar-title').textContent = p.name;
  closeSidebar();
}

// ── Mobile sidebar ───────────────────────────────────────────────────
const sidebarEl = document.getElementById('sidebar-el');
const sidebarOverlay = document.getElementById('sidebar-overlay');
const mobileTopbar = document.getElementById('mobile-topbar');
const menuToggleTop = document.getElementById('menu-toggle-top');
const sidebarClose = document.getElementById('sidebar-close');
const mq = window.matchMedia('(max-width: 700px)');

function openSidebar() { sidebarEl.classList.add('open'); sidebarOverlay.classList.add('visible'); }
function closeSidebar() { sidebarEl.classList.remove('open'); sidebarOverlay.classList.remove('visible'); }

menuToggleTop.addEventListener('click', openSidebar);
sidebarClose.addEventListener('click', closeSidebar);
sidebarOverlay.addEventListener('click', closeSidebar);

function applyMobileLayout(isMobile) {
  mobileTopbar.style.display = isMobile ? 'flex' : 'none';
  sidebarClose.style.display = isMobile ? 'flex' : 'none';
  if (!isMobile) closeSidebar();
}

mq.addEventListener('change', e => applyMobileLayout(e.matches));
applyMobileLayout(mq.matches);

// ── Init: select first page ──────────────────────────────────────────
selectPage(pages[0].id);
</script>
</body>
</html>
