<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p-react · 前端知识库</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <style>
    :root {
      --sidebar-w: 260px;
      --bg-base: #0d1117;
      --bg-elevated: #161b22;
      --bg-overlay: #1c2128;
      --border: #21262d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #484f58;
      --accent: #7c3aed;
      --accent-light: #a78bfa;
      --accent-glow: rgba(124, 58, 237, 0.15);
      --red: #f85149;
      --red-glow: rgba(248, 81, 73, 0.12);
      --yellow: #d29922;
      --yellow-glow: rgba(210, 153, 34, 0.12);
      --green: #3fb950;
      --green-glow: rgba(63, 185, 80, 0.12);
      --blue: #58a6ff;
      --blue-glow: rgba(88, 166, 255, 0.12);
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-code: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-ui);
      background: var(--bg-base);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    .app { display: flex; height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--bg-base);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 18px 16px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo-hexagon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .logo-text { font-size: 15px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.3px; }

    .logo-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--blue);
      background: rgba(88, 166, 255, 0.1);
      border: 1px solid rgba(88, 166, 255, 0.3);
      border-radius: 4px;
      padding: 1px 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 2px; }

    .nav-group { margin-bottom: 4px; }

    .nav-group-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 12px 16px 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 16px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      position: relative;
      color: var(--text-secondary);
      font-size: 13.5px;
    }

    .nav-item:hover { background: var(--bg-overlay); color: var(--text-primary); }

    .nav-item.active {
      background: var(--accent-glow);
      color: var(--accent-light);
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 3px; bottom: 3px;
      width: 3px;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }

    .nav-item-icon { font-size: 14px; flex-shrink: 0; width: 18px; text-align: center; }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .back-link:hover { color: var(--text-secondary); border-color: var(--text-secondary); background: var(--bg-overlay); }

    /* ── Content ── */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-elevated); }

    .content-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 20px;
      height: 40px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .content-header-icon { font-size: 12px; color: var(--text-muted); font-family: var(--font-code); }
    .content-header-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
    .content-header-dot { color: var(--text-muted); font-size: 11px; }
    .content-header-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .content-header-spacer { flex: 1; }

    .content-header-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 7px;
    }

    /* ── Article ── */
    .article-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 32px 36px 48px;
    }

    .article-wrapper::-webkit-scrollbar { width: 8px; }
    .article-wrapper::-webkit-scrollbar-track { background: transparent; }
    .article-wrapper::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }
    .article-wrapper::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

    .article { display: none; }
    .article.active { display: block; }

    /* ── Article card ── */
    .article-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 20px;
    }

    .article-icon {
      font-size: 28px;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .article-meta { flex: 1; }

    .article-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .article-tags { display: flex; gap: 6px; flex-wrap: wrap; }

    .tag {
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      padding: 2px 8px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .tag-danger { color: var(--red); background: var(--red-glow); border: 1px solid rgba(248,81,73,0.25); }
    .tag-warning { color: var(--yellow); background: var(--yellow-glow); border: 1px solid rgba(210,153,34,0.25); }
    .tag-info { color: var(--blue); background: var(--blue-glow); border: 1px solid rgba(88,166,255,0.25); }
    .tag-success { color: var(--green); background: var(--green-glow); border: 1px solid rgba(63,185,80,0.25); }
    .tag-accent { color: var(--accent-light); background: var(--accent-glow); border: 1px solid rgba(124,58,237,0.3); }

    .article-divider { height: 1px; background: var(--border); margin-bottom: 24px; }

    /* ── Section blocks ── */
    .section { margin-bottom: 28px; }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .section-body {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.8;
    }

    .section-body p { margin-bottom: 10px; }
    .section-body p:last-child { margin-bottom: 0; }
    .section-body strong { color: var(--text-primary); font-weight: 600; }
    .section-body ul { padding-left: 20px; margin-bottom: 10px; }
    .section-body li { margin-bottom: 4px; }

    .section-body code {
      font-family: var(--font-code);
      font-size: 12px;
      background: var(--bg-overlay);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      color: var(--accent-light);
    }

    /* ── Code blocks ── */
    .code-block-wrap {
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .code-block-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: var(--bg-overlay);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-family: var(--font-code);
    }

    .code-block-label-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-red { background: var(--red); }
    .dot-green { background: var(--green); }
    .dot-yellow { background: var(--yellow); }
    .dot-blue { background: var(--blue); }

    .code-block-label-text { color: var(--text-secondary); }

    .code-block-wrap pre { margin: 0; padding: 16px 18px; background: var(--bg-base) !important; }
    .code-block-wrap code {
      font-family: var(--font-code) !important;
      font-size: 12px !important;
      line-height: 1.7 !important;
    }
    .code-block-wrap .hljs { background: var(--bg-base) !important; }

    /* ── Rule box ── */
    .rule-box {
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 14px;
      border-left: 3px solid;
      font-size: 13.5px;
      line-height: 1.7;
    }

    .rule-box-danger {
      background: var(--red-glow);
      border-color: var(--red);
      color: #ffa8a8;
    }

    .rule-box-warning {
      background: var(--yellow-glow);
      border-color: var(--yellow);
      color: #f0c070;
    }

    .rule-box-info {
      background: var(--blue-glow);
      border-color: var(--blue);
      color: #a0c8ff;
    }

    .rule-box-success {
      background: var(--green-glow);
      border-color: var(--green);
      color: #90dca0;
    }

    .rule-box strong { color: inherit; font-weight: 700; }
    .rule-box code {
      font-family: var(--font-code);
      font-size: 11.5px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      padding: 1px 5px;
    }

    /* ── Metrics table ── */
    .metrics-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 8px;
    }

    .metrics-table thead tr { border-bottom: 1px solid var(--border); }
    .metrics-table th {
      text-align: left;
      padding: 6px 12px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    .metrics-table td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
      vertical-align: top;
      line-height: 1.6;
    }
    .metrics-table tr:last-child td { border-bottom: none; }
    .metrics-table td:first-child {
      font-family: var(--font-code);
      font-size: 11.5px;
      color: var(--accent-light);
      white-space: nowrap;
    }

    /* ── Mobile ── */
    .menu-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .menu-toggle:hover { background: var(--bg-overlay); color: var(--text-primary); }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 99;
    }
    .sidebar-overlay.visible { display: block; }

    @media (max-width: 700px) {
      body { overflow: hidden; }
      .menu-toggle { display: flex; }
      .app { flex-direction: column; }

      .sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: 260px;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }
      .sidebar.open { transform: translateX(0); }

      .mobile-topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        height: 48px;
        background: var(--bg-base);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .mobile-topbar-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .content { height: calc(100vh - 48px); }
      .article-wrapper { padding: 20px 16px 40px; }
      .nav-item { padding: 11px 16px; font-size: 14px; }
    }
  </style>
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="app">
  <!-- Mobile Topbar -->
  <div class="mobile-topbar" id="mobile-topbar" style="display:none">
    <button class="menu-toggle" id="menu-toggle-top" aria-label="打开菜单">☰</button>
    <span class="mobile-topbar-title" id="mobile-topbar-title">前端知识库</span>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar-el">
    <div class="sidebar-logo">
      <div class="logo-hexagon">p</div>
      <span class="logo-text">p-react</span>
      <span class="logo-badge">knowledge</span>
      <div style="flex:1"></div>
      <button class="menu-toggle" id="sidebar-close" aria-label="关闭菜单" style="display:none">✕</button>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <a class="back-link" href="../hub.html">← 返回 Hub</a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="content">
    <div class="content-header">
      <span class="content-header-icon">📚</span>
      <span class="content-header-label">前端知识库</span>
      <span class="content-header-dot">·</span>
      <span class="content-header-name" id="content-header-name">选择左侧条目</span>
      <div class="content-header-spacer"></div>
      <span class="content-header-badge" id="content-header-badge">性能优化</span>
    </div>
    <div class="article-wrapper" id="article-wrapper"></div>
  </main>
</div>

<script src="/knowledge/highlight.min.js"></script>
<script src="/knowledge/data.js"></script>
<script src="/knowledge/app.js"></script>
</body>
</html>
